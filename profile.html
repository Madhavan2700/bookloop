<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🔄📚 Book Loop | Profile</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">


<style>

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;

}



body{


min-height:100vh;


display:flex;


justify-content:center;


align-items:center;



background:

linear-gradient(
135deg,
#4338ca,
#0891b2,
#db2777
);


padding:30px;


}



/* Profile Card */


.profile-container{


width:450px;


padding:40px;


border-radius:30px;



background:

rgba(255,255,255,.18);



backdrop-filter:blur(20px);



border:

1px solid rgba(255,255,255,.3);



box-shadow:

0 25px 60px rgba(0,0,0,.35);



color:white;



text-align:center;



}





.logo{


font-size:45px;


}





h1{


font-size:32px;


margin-bottom:10px;


}



.subtitle{


color:#e5e7eb;


margin-bottom:30px;


}




/* Profile Image */


.profile-photo{


width:140px;


height:140px;


border-radius:50%;


background:white;


margin:auto;


overflow:hidden;


border:5px solid #53ffd4;


display:flex;


align-items:center;


justify-content:center;



}



.profile-photo img{


width:100%;


height:100%;


object-fit:cover;


}




.upload-label{


display:inline-block;


margin-top:15px;


padding:10px 25px;


border-radius:30px;


background:white;


color:#4338ca;


font-weight:600;


cursor:pointer;


}



#photo-upload{


display:none;


}





/* Input */


.form-group{


text-align:left;


margin-top:20px;


}



label{


font-weight:600;


font-size:14px;


}



input{


width:100%;


padding:14px;


margin-top:8px;


border:none;


outline:none;


border-radius:12px;


font-size:15px;


}





input:focus{


box-shadow:

0 0 10px #53ffd4;


}




/* Button */


button{


width:100%;


margin-top:30px;


padding:15px;


border:none;


border-radius:30px;



background:

linear-gradient(
90deg,
#53ffd4,
#38bdf8
);



color:white;


font-size:17px;


font-weight:700;


cursor:pointer;



transition:.3s;


}



button:hover{


transform:translateY(-5px);


box-shadow:

0 10px 25px rgba(0,0,0,.3);


}





.back{


display:block;


margin-top:20px;


text-decoration:none;


color:white;


font-weight:600;


}




</style>


</head>




<body>




<div class="profile-container">



<div class="logo">

🔄📚

</div>




<h1>

My Profile

</h1>



<p class="subtitle">

Manage your Book Loop account

</p>





<!-- Profile Photo -->


<div class="profile-photo">


<img id="preview" src="profile.png" alt="Profile">


</div>




<label for="photo-upload" class="upload-label">

Upload Photo

</label>



<input 
type="file"
id="photo-upload"
accept="image/*"
onchange="previewImage(event)">






<!-- User Details -->



<div class="form-group">


<label>

User Name

</label>


<input 
type="text"
id="username">

</div>






<div class="form-group">


<label>

Register Number

</label>


<input 
type="text"
id="regno"
readonly>


</div>






<div class="form-group">


<label>

Date of Birth

</label>


<input 
type="date"
id="dob"
readonly>

</div>






<button id="saveBtn">

Save Changes

</button>





<a href="home.html" class="back">

← Back to Home

</a>




</div>







<script>


function previewImage(event){


let image=document.getElementById("preview");


image.src=URL.createObjectURL(event.target.files[0]);


}



</script>


<script>

const student = JSON.parse(localStorage.getItem("student"));

if(student){

    document.getElementById("username").value = student.username;
    document.getElementById("regno").value = student.reg_no;

    // Convert database date (YYYY-MM-DD) to input date
    document.getElementById("dob").value = student.dob;

}

</script>
</body>

</html>
