<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🔄📚 Book Loop | Sell Book</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">


<style>

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;

}



body{

min-height:100vh;

background:

linear-gradient(
135deg,
#4338ca,
#0891b2,
#db2777
);


display:flex;

justify-content:center;

align-items:center;

padding:30px;

}



/* Main Container */


.sell-container{


width:650px;


background:

rgba(255,255,255,.18);


backdrop-filter:blur(20px);


border-radius:30px;


padding:40px;


border:

1px solid rgba(255,255,255,.3);


box-shadow:

0 25px 60px rgba(0,0,0,.3);


}





.logo{

text-align:center;

font-size:50px;

}



h1{

text-align:center;

color:white;

font-size:35px;

}



.subtitle{

text-align:center;

color:#e5e7eb;

margin:10px 0 30px;

}



/* Form */


.form-group{


margin-bottom:18px;


}



label{


color:white;


font-weight:600;


font-size:14px;


}



input,
select{


width:100%;


padding:14px;


margin-top:8px;


border:none;


outline:none;


border-radius:12px;


font-size:15px;


background:white;


}




input:focus,
select:focus{


box-shadow:

0 0 10px #53ffd4;


}



/* Two column */


.row{


display:flex;


gap:20px;


}



.row .form-group{


width:50%;


}





/* Upload */


.file-box{


background:white;


padding:12px;


border-radius:12px;


margin-top:8px;


}




/* Button */


button{


width:100%;


padding:15px;


border:none;


border-radius:30px;


margin-top:20px;



background:

linear-gradient(
90deg,
#53ffd4,
#38bdf8
);



color:white;


font-size:18px;


font-weight:700;


cursor:pointer;


transition:.3s;


}



button:hover{


transform:translateY(-5px);


box-shadow:

0 10px 25px rgba(0,0,0,.3);


}




.back{


display:block;


text-align:center;


margin-top:20px;


color:white;


text-decoration:none;


font-weight:600;


}




@media(max-width:600px){


.sell-container{

width:100%;

padding:25px;

}


.row{

flex-direction:column;

}


.row .form-group{

width:100%;

}


}


</style>

</head>



<body>





<div class="sell-container">



<div class="logo">

🔄📚

</div>



<h1>

Sell Your Book

</h1>


<p class="subtitle">

Help students by sharing your books

</p>






<form>





<div class="form-group">


<label>

Upload Book Photo

</label>


<div class="file-box">

<input type="file" accept="image/*">

</div>


</div>






<div class="form-group">


<label>

Book Name

</label>


<input 
type="text"
placeholder="Enter book name"
required>


</div>







<div class="form-group">


<label>

Author Name

</label>


<input 
type="text"
placeholder="Enter author name"
required>


</div>







<div class="row">



<div class="form-group">


<label>

Subject Name

</label>


<input 
type="text"
placeholder="Eg: Data Structures">


</div>





<div class="form-group">


<label>

Subject Code

</label>


<input 
type="text"
placeholder="Eg: CS8591">


</div>



</div>








<div class="row">



<div class="form-group">


<label>

Original Book Price

</label>


<input 
type="number"
placeholder="₹ Original price">


</div>





<div class="form-group">


<label>

Retail Price

</label>


<input 
type="number"
placeholder="₹ Current market price">


</div>



</div>








<div class="form-group">


<label>

Selling Price

</label>


<input 
type="number"
placeholder="Enter selling price">


</div>







<div class="form-group">


<label>

Book Category

</label>


<select>


<option>Select Category</option>

<option>College</option>

<option>School</option>

<option>TN Exam Books</option>

<option>Others</option>


</select>


</div>








<button type="submit">

Upload Book

</button>




</form>






<a href="home.html" class="back">

← Back to Home

</a>




</div>





</body>

</html>
