<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🔄📚 Book Loop | Create Account</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
background:linear-gradient(
135deg,
#4f46e5,
#06b6d4,
#ec4899
);
position:relative;
}

/* Background Words */

.words span{
position:absolute;
color:rgba(255,255,255,0.18);
font-size:35px;
font-weight:700;
white-space:nowrap;
animation:move 12s infinite alternate;
}

.words span:nth-child(1){
top:10%;
left:5%;
}

.words span:nth-child(2){
top:25%;
right:10%;
}

.words span:nth-child(3){
top:45%;
left:15%;
}

.words span:nth-child(4){
top:70%;
right:15%;
}

.words span:nth-child(5){
top:85%;
left:25%;
}

@keyframes move{
from{
transform:translateX(-20px);
}
to{
transform:translateX(30px);
}
}

/* Create Account Glass Box */

.signup-box{
width:420px;
padding:40px;
border-radius:30px;
background:rgba(255,255,255,0.18);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,0.3);
box-shadow:0 25px 60px rgba(0,0,0,.3);
text-align:center;
color:white;
}

.logo{
font-size:55px;
}

h1{
font-size:35px;
margin:10px 0;
color:white;
}

p{
color:#f1f1f1;
margin-bottom:25px;
}

/* Input */

.input-box{
text-align:left;
margin-bottom:20px;
}

label{
font-weight:600;
color:white;
}

input{
width:100%;
padding:14px;
margin-top:8px;
border-radius:15px;
border:none;
outline:none;
font-size:16px;
background:rgba(255,255,255,.9);
}

input:focus{
box-shadow:0 0 10px #53ffd4;
}

/* Button */

button{
width:100%;
padding:15px;
border:none;
border-radius:30px;
background:linear-gradient(
90deg,
#53ffd4,
#38bdf8
);
color:white;
font-size:18px;
font-weight:700;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:translateY(-5px);
box-shadow:0 10px 25px rgba(0,0,0,.3);
}

/* Links */

.link{
display:block;
margin-top:20px;
text-decoration:none;
color:white;
font-weight:600;
}

.note{
font-size:13px;
margin-top:15px;
color:#eee;
}

</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<!-- Floating Words -->
<div class="words">
<span>BUY BOOKS</span>
<span>SELL BOOKS</span>
<span>REUSE</span>
<span>LEARN</span>
<span>SMART LEARNING</span>
</div>

<div class="signup-box">

<div class="logo">
🔄📚
</div>

<h1>Create Account</h1>

<p>Join Book Loop Campus Exchange</p>

<!-- Updated Form -->
<form id="signupForm"">

<div class="input-box">
<label>User Name</label>
<input
type="text"
id="username"
placeholder="Enter your name"
required>
</div>

<div class="input-box">
<label>Register Number</label>
<input
type="number"
id="regno"
placeholder="Enter Register Number"
required>
</div>

<div class="input-box">
<label>Date of Birth</label>
<input
type="date"
id="dob"
required>
</div>

<button type="button" id="signupBtn">
Create Account
</button>

</form>

<div class="note">
Register number must contain only numbers
</div>

<a href="login.html" class="link">
Already have an account? Login
</a>

<a href="index.html" class="link">
← Back to Book Loop
</a>

</div>
  <button id="signupBtn">signup</button>
  <script src="supabase.js"></script>
  <script src="signup.js"></script>
</body>
</html>
