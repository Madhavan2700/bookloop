<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🔄📚 Book Loop | Student Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">


<style>

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;

}


body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

background:

linear-gradient(
135deg,
#4f46e5,
#06b6d4,
#ec4899
);

position:relative;

}



/* Floating Words */

.words span{

position:absolute;

color:rgba(255,255,255,0.18);

font-size:35px;

font-weight:700;

white-space:nowrap;

animation:move 12s infinite alternate;

}



.words span:nth-child(1){

top:10%;
left:5%;

}

.words span:nth-child(2){

top:25%;
right:10%;

}

.words span:nth-child(3){

top:45%;
left:15%;

}

.words span:nth-child(4){

top:70%;
right:15%;

}

.words span:nth-child(5){

top:85%;
left:25%;

}


@keyframes move{

from{

transform:translateX(-20px);

}

to{

transform:translateX(30px);

}

}



/* Login Glass Box */


.login-box{

width:420px;

padding:40px;

border-radius:30px;


/* Transparent background */

background:

rgba(255,255,255,0.18);


backdrop-filter:blur(18px);


border:1px solid rgba(255,255,255,0.3);


box-shadow:

0 25px 60px rgba(0,0,0,.3);


text-align:center;

color:white;

}



.logo{

font-size:55px;

}



h1{

font-size:35px;

margin:10px 0;

color:white;

}


p{

color:#f1f1f1;

margin-bottom:25px;

}



/* Input Area */


.input-box{

text-align:left;

margin-bottom:20px;

}


label{

font-weight:600;

color:white;

}



input{

width:100%;

padding:14px;

margin-top:8px;

border-radius:15px;

border:none;

outline:none;

font-size:16px;


background:

rgba(255,255,255,.9);

}



input:focus{

box-shadow:

0 0 10px #53ffd4;

}



/* Button */


button{


width:100%;

padding:15px;

border:none;

border-radius:30px;


background:

linear-gradient(
90deg,
#53ffd4,
#38bdf8
);


color:white;

font-size:18px;

font-weight:700;

cursor:pointer;

transition:.3s;

}



button:hover{

transform:translateY(-5px);

box-shadow:

0 10px 25px rgba(0,0,0,.3);

}



/* Back */


.back{

display:block;

margin-top:25px;

text-decoration:none;

color:white;

font-weight:600;

}



.note{

font-size:13px;

margin-top:15px;

color:#eee;

}



</style>


</head>


<body>



<!-- Background Words -->

<div class="words">

<span>BUY BOOKS</span>

<span>SELL BOOKS</span>

<span>REUSE</span>

<span>LEARN</span>

<span>SMART LEARNING</span>

</div>





<div class="login-box">


<div class="logo">

🔄📚

</div>



<h1>

Student Login

</h1>



<p>

Book Loop Campus Exchange

</p>





<form>



<div class="input-box">


<label>

Register Number

</label>


<input

type="number"

placeholder="Enter Register Number"

required>


</div>





<div class="input-box">


<label>

Password (Date of Birth)

</label>


<input

type="password"

placeholder="DD-MM-YYYY"

pattern="[0-9]{2}-[0-9]{2}-[0-9]{4}"

required>


</div>





<button type="submit">

Login

</button>



</form>





<div class="note">

Password format: DD-MM-YYYY

</div>





<a href="index.html" class="back">

← Back to Book Loop

</a>



</div>




</body>

</html>
